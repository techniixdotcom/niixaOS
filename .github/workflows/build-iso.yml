# Builds the ISO on GitHub's runners.
#   - every push / pull request: the build must succeed (ISO kept 7 days as an artifact)
#   - a tag like v2026.10.19: the ISO is published as a GitHub release
#
# GitHub release files must be under 2 GiB each. A bigger ISO is published in
# parts plus a checksum of the whole ISO (README.md shows how to join them).
name: Build ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release step's job may write.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -x -S warning build.sh build/in-container.sh \
            profile/airootfs/usr/local/lib/niix/niix-install \
            profile/airootfs/usr/local/lib/niix-build/customize-image
          for f in profile/airootfs/usr/local/bin/*; do
            head -1 "$f" | grep -q bash && bash -n "$f"
          done
      - name: Python tools
        run: |
          for f in profile/airootfs/usr/local/bin/*; do
            head -1 "$f" | grep -q python && python3 -m py_compile "$f"
          done
          python3 -m py_compile build/gen-icon-theme.py

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publishing the release on a tag
    timeout-minutes: 300
    container:
      image: archlinux/archlinux:latest
      # mkarchiso mounts inside the image; see build.sh for the other options
      options: --privileged --pids-limit -1 --ulimit nofile=1024:524288
      volumes:
        - /:/host
    env:
      NIIX_IN_CONTAINER: '1'
      NIIX_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The runner has ~14 GB free; the build needs ~35 GB. These preinstalled
      # SDKs on the host are not needed.
      - name: Free disk space
        run: |
          rm -rf /host/usr/share/dotnet /host/usr/local/lib/android /host/opt/ghc \
                 /host/opt/hostedtoolcache /host/usr/local/share/boost /host/usr/share/swift \
                 /host/usr/local/.ghcup /host/usr/lib/jvm || true
          df -h /
      - name: Install git
        run: pacman -Syu --noconfirm git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
      - name: Build the ISO
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash build/in-container.sh --split
      - name: Keep the ISO (7 days)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: niixaos-iso
          path: |
            out/*.iso
            out/*.sha256
          retention-days: 7
          compression-level: 0
      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64   # v3.0.3
        with:
          name: NiiX Arch ${{ github.ref_name }}
          generate_release_notes: true
          files: out/release/*
