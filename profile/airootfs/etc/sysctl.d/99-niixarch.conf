vm.swappiness=100
vm.page-cluster=0
vm.vfs_cache_pressure=50
vm.compaction_proactiveness=0
vm.watermark_boost_factor=0
vm.max_map_count=2147483642
# Write big copies and game downloads out in steady small steps instead of
# piling up gigabytes and then stalling everything (CachyOS's values)
vm.dirty_bytes=268435456
vm.dirty_background_bytes=67108864
fs.inotify.max_user_watches=524288
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr
# Bigger socket buffers: lets fast connections (Steam downloads, streaming)
# reach full speed - the defaults cap a single download well below 1 Gbit
# on longer routes.
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.ipv4.tcp_rmem=4096 131072 16777216
net.ipv4.tcp_wmem=4096 16384 16777216
net.core.netdev_max_backlog=16384
# Find the right packet size when a router on the way drops big ones
# (otherwise downloads can stall or hang on some ISPs/VPNs)
net.ipv4.tcp_mtu_probing=1
# No speed reset after a pause - web pages and game launchers stay quick
net.ipv4.tcp_slow_start_after_idle=0
# Faster repeat connections to the same server
net.ipv4.tcp_fastopen=3
