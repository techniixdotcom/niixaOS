# niix-qos settings (the bufferbloat fix). Check what it does with: niix-qos status
#
#   auto  shape the internet connection with CAKE, at the speed measured for
#         each network (measured once per network, when it is first used)
#   off   no shaping anywhere (same as: niix-qos disable)
#
# For one boot: niix.qos=off on the kernel command line (press E on the entry
# in the Limine menu).
QOS_MODE=auto

# Share of the measured speed CAKE sends at. Lower = steadier ping under load,
# higher = a little more speed. The download needs more room: it can only be
# slowed down after it has crossed the line.
DOWN_PERCENT=85
UP_PERCENT=90

# Faster than this (Mbit/s), a direction is not shaped: the queue empties
# quickly enough on its own, and shaping it would only cost CPU.
MAX_SHAPE_MBIT=1500

# Networks measured automatically are measured again after this many days
# (internet plans change).
REMEASURE_DAYS=60
