# niix-gpu settings. Check what is in use with: niix-gpu status
#
#   auto  the most powerful GPU is used for the desktop, every app and every
#         game - chosen again at each boot
#   off   leave the choice to the system defaults
#
# If the desktop ever fails to start, add niix.gpu=off to the kernel command
# line for one boot (press E on the entry in the Limine menu).
GPU_MODE=auto
