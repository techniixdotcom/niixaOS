# NiiX: a systemd initramfs. sd-encrypt unlocks the disk (rd.luks.name= on
# the kernel command line) and sd-vconsole loads the keyboard layout for the
# password prompt. chwd adds NVIDIA's modules in its own drop-in.
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block sd-encrypt btrfs filesystems fsck)
