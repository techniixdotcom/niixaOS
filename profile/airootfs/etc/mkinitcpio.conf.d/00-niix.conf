# NiiX: systemd-based initramfs. sd-encrypt unlocks the disk (rd.luks.name=
# on the kernel command line), sd-vconsole loads the keyboard layout for the
# password prompt. NVIDIA's modules are added by chwd's own drop-in when its
# driver needs them early.
MODULES=()
BINARIES=()
FILES=()
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block sd-encrypt btrfs filesystems fsck)
