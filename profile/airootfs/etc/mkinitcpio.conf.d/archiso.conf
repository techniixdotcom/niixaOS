# Live ISO only (the installer deletes it): archiso's hooks find and mount the
# image, also when the ISO file itself is booted from a stick (archiso_loop_mnt).
# Sourced after 00-niix.conf, so these hooks win on the live system.
HOOKS=(base udev microcode modconf kms archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
