# NiiX Arch - pacman.conf
#
# CachyOS's x86-64-v3 builds come first, then CachyOS, then Arch. The ISO is
# built from exactly this file, and the installer copies it to the new system
# (on a CPU with x86-64-v4 it adds CachyOS's v4 repositories above the v3 ones).

[options]
HoldPkg     = pacman glibc
Architecture = x86_64 x86_64_v3
CheckSpace
Color
ParallelDownloads = 15
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
